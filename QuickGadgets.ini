; Virtual-key values. Defaults: Alt + 1..8. F10 toggles the mod.
; Configure the three GameBindings values to exactly match the bindings you set
; under Marvel's Spider-Man Remastered > Settings > Keyboard & Mouse.

[QuickGadgets]
Enabled=1
; Keep 0 for the native/controller route. Set 1 only for the legacy keyboard-wheel test.
KeyboardWheelFallback=0
; Directly calls HeroWeaponManager in game version 4.0630.0.0. Alt+1..8 are
; physical triggers for testing; they do not synthesize keyboard input.
NativeDirectSelect=1
; After selecting, pulse the engine's native kUseGadget action. Set 0 to test
; selection only if direct firing causes a problem.
NativeDirectFire=1
; Diagnostic only. Leave 0 for normal play; enabling this probes live game components.
NativeProbe=0
; Probe stages: 1 hero pointer, 2 component count, 3 names, 4 vtables, 5 lookups.
NativeProbeLevel=1
Modifier=18
ToggleKey=121
Slot1=49
Slot2=50
Slot3=51
Slot4=52
Slot5=53
Slot6=54
Slot7=55
Slot8=56
AnchorPreviousPulses=12
InputDelayMs=18
; Legacy fallback only. Native auto-restore is deferred until direct fire is validated.
RestoreWebShooter=0

[Controller]
; Native XInput shortcuts. Keep the game's Gadget Select Button on Hold R1.
; Slot values are gadget-wheel positions 1 through 8.
; -1 automatically uses the first connected XInput controller; 0 through 3
; force an XInput user index.
Index=-1
Enabled=1
L1Tap=2
DpadLeft=5
DpadRight=4
L1DpadLeft=3
L1DpadRight=7
L2DpadLeft=6
L2DpadRight=8
; An L1 press longer than this without a D-pad chord is ignored.
L1TapMaxMs=500
; XInput analog trigger threshold, from 1 through 255.
L2Threshold=30
; Keep the fired gadget active for this repeat window, then restore Web Shooter.
; Further shortcut presses reset the timer; holding L1/L2 pauses restoration.
AutoRestoreWebShooter=1
RepeatWindowMs=450

[GameBindings]
Previous=219
Next=221
Use=69
