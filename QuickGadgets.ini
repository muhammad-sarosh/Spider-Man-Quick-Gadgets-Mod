; Quick Gadgets v1.0.0 by Sticky Sushi
; Controller mod with opt-in experimental keyboard support for version 4.0630.0.0.
;
; Gadget names accepted below:
; WebShooter, ImpactWeb, SpiderDrone, ElectricWeb, WebBomb,
; TripMine, ConcussiveBlast, SuspensionMatrix, None
;
; Use "None" to disable a shortcut. Changes require a game restart.

[General]
; Master switch. F10 also toggles the mod while the game is running.
Enabled=1

; Return to Web Shooter after a shortcut is used.
; This is why Web Shooter has no shortcut by default.
AutoRestoreWebShooter=1

; Time in milliseconds before returning to Web Shooter.
; Using another shortcut resets the timer. Holding L1 or L2 pauses it.
RepeatWindowMs=450

[ControllerBindings]
; Change the gadget name on the right to reassign a shortcut.
; Example: L2DpadLeft=ImpactWeb
L1Tap=ImpactWeb
DpadLeft=WebBomb
DpadRight=ElectricWeb
L1DpadLeft=SpiderDrone
L1DpadRight=ConcussiveBlast
L2DpadLeft=TripMine
L2DpadRight=SuspensionMatrix

[Controller]
; XInput controller support.
Enabled=1

; -1 selects the first connected controller automatically.
; Use 0, 1, 2, or 3 only if automatic selection chooses the wrong controller.
Index=-1

; Maximum L1 tap duration in milliseconds. Longer presses without a
; D-pad direction do not fire the L1Tap shortcut.
L1TapMaxMs=500

; L2 analog activation threshold from 1 to 255.
L2Threshold=30

[Keyboard]
; EXPERIMENTAL: set 1 to test native keyboard/mouse gadget shortcuts.
; No gadget-wheel key simulation. Controller shortcuts remain independent.
Enabled=0
; 0: one tap selects and fires (default).
; 1: one tap only selects; double-tap the same key to fire.
; In mode 1, a single-tap selection stays active until another selection.
SingleTapSelectDoubleTapFire=0
; Maximum time between taps in mode 1, from 150 to 1000 milliseconds.
DoubleTapWindowMs=350
; Change the key name on the right. One shot per press; release to fire again.
; Supported: A-Z, 0-9, F1-F24, Numpad0-Numpad9, Mouse1-Mouse5,
; Space, Tab, Enter, Backspace, Delete, Home, End, PageUp, PageDown,
; Left, Right, Up, Down, LShift/RShift, LCtrl/RCtrl, LAlt/RAlt,
; Semicolon, Equals, Comma, Minus, Period, Slash, Backtick, LBracket,
; Backslash, RBracket, Apostrophe, and None.
; Advanced: VK1 through VK255 accepts any Windows virtual-key number.
; Do NOT bind these keys to other game actions: this mod does not block them.
; Duplicate keys, F10 (mod toggle), and Insert (Script Hook reload) are disabled.
; F12 may activate Steam screenshots. Numpad keys require Num Lock on.
; Menu behavior needs testing: toggle OFF with F10 before opening menus,
; then toggle ON after returning to gameplay. Shortcuts ignore other apps.
; Web Shooter is None by default because automatic restoration already returns
; to it, but you may assign a key for a direct Web Shooter shortcut.
WebShooter=None
ImpactWeb=F1
WebBomb=F2
ElectricWeb=F3
SpiderDrone=F4
ConcussiveBlast=F5
TripMine=F6
SuspensionMatrix=F7
